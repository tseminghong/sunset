<!DOCTYPE html>
<html>
<head>
  <title>My First Anime.js Animation</title>
  <style>
    body {
      background-color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .square {
      width: 50px;
      height: 50px;
      background-color: #4169E1;
      margin: 10px;
    }
  </style>
</head>
<body>

  <div class="square"></div>
  <div class="square"></div>
  <div class="square"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

  <script>
    anime({
      targets: '.square',
      translateX: 270,
      rotate: '1turn',
      backgroundColor: '#FF69B4', 
      duration: 3000,
      loop: true,
      direction: 'alternate',
      easing: 'easeInOutSine',
      delay: anime.stagger(200) 
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>My First Anime.js Animation</title>
  <style>
    body {
      background-color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .circle {
      width: 50px;
      height: 50px;
      background-color: #4169E1;
      margin: 10px;
      border-radius: 50%;
    }
    .circle2 {
      width: 50px;
      height: 50px;
      background-color: #4169E1;
      margin: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div class="circle"></div>
  <div class="circle2"></div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

  <script>
    anime({
      targets: '.circle',
      translateX: [-180, 180],
      rotate: '1turn',
      backgroundColor: '#FF69B4', 
      duration: 2000,
      loop: true,
      direction: 'alternate',
      easing: 'easeInOutSine',
      delay: anime.stagger(200) 
    });
    anime({
      targets: '.circle2',
      translateY: [-180, 180],
      rotate: '1turn',
      backgroundColor: '#FF69B4', 
      duration: 2000,
      loop: true,
      direction: 'alternate',
      easing: 'easeInOutSine',
      delay: anime.stagger(200) 
    });
  </script>

</body>
</html>

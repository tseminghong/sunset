name: flutter_ict_hub
description: "HPCSS ICT Revision Hub - Flutter Implementation"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.0
  
  # Routing & Navigation
  go_router: ^14.0.0
  
  # Internationalization
  intl: ^0.19.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # HTTP Client
  http: ^1.1.0
  
  # Animations
  flutter_animate: ^4.2.0+1
  
  # UI Components
  cupertino_icons: ^1.0.0
  
  # Icons
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Fonts
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# Android configuration
android:
  package: com.hpcss.ictrevisionhub
  compileSdkVersion: 34
  minSdkVersion: 21
  targetSdkVersion: 34

# iOS configuration
ios:
  deploymentTarget: '12.0'
